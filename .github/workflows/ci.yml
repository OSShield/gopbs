# name: CI

on:
  push:
  pull_request:

jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet
        run: go vet ./...
      
      - name: Staticcheck
        uses: dominikh/staticcheck-action@v1
        continue-on-error: true
        with:
          install-go: false

      
      - name: Test (race)
        run: go test -race ./...
      
      - name: Go tests
        uses: robherley/go-test-action@v1
        with:
            moduleDirectory: .
            cover: true


  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Fuzz (20s per target)
        run: |
          go test ./pxar    -run '^$' -fuzz '^FuzzValidateFilename$' -fuzztime 20s
          go test ./pxar    -run '^$' -fuzz '^FuzzPermuteBST$'       -fuzztime 20s
          go test ./catalog -run '^$' -fuzz '^FuzzDecode$'           -fuzztime 20s
          go test ./catalog -run '^$' -fuzz '^FuzzVarint$'           -fuzztime 20s
          go test ./chunker -run '^$' -fuzz '^FuzzSplit$'            -fuzztime 20s
          go test ./scan    -run '^$' -fuzz '^FuzzParseACLXattr$'    -fuzztime 20s

  integration-tests:
    runs-on: ubuntu-latest
    permissions: read-all
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: tests/go.mod
        
      - name: Vet (integration tag)
        working-directory: tests
        run: go vet -tags integration ./...
    
      - name: Install docker
        uses: docker/setup-buildx-action@v2
        with:
          version: latest
    
      - name: Test (integration tag)
        working-directory: tests
        run: |
            sudo chown -R 1000:root .test-*
            sudo chmod -R 777 .test-*
            sed -i "s/1000:1000/$(id -u):$(id -g)/g" compose.yml
            docker compose pull
            docker compose build gopbs

      - name: Go tests
        uses: robherley/go-test-action@v1
        with:
            moduleDirectory: tests
            testArguments: -tags integration
            cover: true
