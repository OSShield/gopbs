services:
  tizbac:
    user: 1000:1000
    build:
      context: .
      dockerfile: tizbac.Dockerfile
    volumes:
      - ./.test-source:/source:ro
      - ./.test-pxar:/pxar:rw

  pbs:
    user: 1000:1000
    build:
      context: .
      dockerfile: pbs.Dockerfile
    command:
      - "create"
      - "/pxar/pbs.pxar"
      - "/source"
    volumes:
      - ./.test-source:/source:ro
      - ./.test-pxar:/pxar:rw

  gopbs:
    user: 1000:1000
    build:
      context: ..
      dockerfile: tests/gopbs.Dockerfile
    command:
      - -catalog
      - /pxar/gopbs.pcat1
      - /pxar/gopbs.pxar
      - /source
    volumes:
      - ./.test-source:/source:ro
      - ./.test-pxar:/pxar:rw

  restore:
    user: 1000:1000
    build:
      context: .
      dockerfile: pbs.Dockerfile
    entrypoint: ""
    command:
      - "bash"
      - "-ec"
      - |
        rm -rf /restore/pbs /restore/tizbac /restore/gopbs
        pxar extract /pxar/pbs.pxar /restore/pbs
        pxar extract /pxar/tizbac.pxar /restore/tizbac
        pxar extract /pxar/gopbs.pxar /restore/gopbs
    volumes:
      - ./.test-pxar:/pxar:ro
      - ./.test-restore:/restore:rw
